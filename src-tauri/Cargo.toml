[package]
name = "fieldnote"
version = "0.5.1"
description = "A local notebook for conversations, with questionnaires and audio"
edition = "2021"
license = "MIT"

[lib]
name = "fieldnote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cpal = "0.18"
zip = { version = "9.2", default-features = false }
tempfile = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
